name: precommit
on: [push, workflow_call]
jobs:
  license:
    uses: xenoterracide/github/.github/workflows/license.yml@5a9249bca4464d8d216d78c7e76a7bf684d2a387
  format:
    uses: xenoterracide/github/.github/workflows/format.yml@5a9249bca4464d8d216d78c7e76a7bf684d2a387
  format-kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: asdf-vm/actions/plugins-add@v4.0.1
      - run: asdf install ktlint
      - run: ktlint '*.gradle.kts' '**/*.gradle.kts'
