name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6.0.2
      - &java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
      - &gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew version build --console=plain
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
      - uses: gradle/actions/dependency-submission@v6.1.0
        if: ${{ github.ref_name == 'develop' }}
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6.0.2
      - *java
      - *gradle
      - run: ./gradlew build --console=plain --no-build-cache --no-configuration-cache --rerun-tasks
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      IS_PUBLISHING: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
          filter: "blob:none"
          fetch-depth: 0
          fetch-tags: true
      - run: git remote set-head --auto origin
      - *java
      - *gradle
      - run: ./gradlew version --quiet
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
      - run: ./gradlew publishAllPublicationsToStagingRepository
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      - run: ./gradlew publishAllPublicationsToGhRepository --info
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
