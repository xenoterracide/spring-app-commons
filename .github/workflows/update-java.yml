name: update-java
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - "ci/auto-update**"
jobs:
  update-java:
    uses: xenoterracide/github/.github/workflows/update-java.yml@5a9249bca4464d8d216d78c7e76a7bf684d2a387
    secrets:
      gradle_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      merge_pat: ${{ secrets.GH_MERGE_PAT }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
