data:
  persistence-units:
    jakarta:
      - connection:
          # username: "user"
          # password: "password"
          url: jdbc:h2:mem:2
          jdbc-driver-class-name: org.h2.Driver
          # EclipseLink properties
          properties:
            eclipselink.target-database: H2
            eclipselink.target-server: None
            jakarta.persistence.schema-generation.database.action: database
